name: GamerzClass
description: GamerzClass was a Copenhagen, Denmark-based online esports education platform,
  founded in 2018, that offered structured masterclasses and one-on-one coaching from
  professional players across titles such as Counter-Strike, League of Legends, and
  Dota 2. Backed by 500 Global, ByFounders, Bumble Ventures, and TrueSight Ventures,
  the company raised roughly USD 2.5M before being acquired by US-based esports coaching
  marketplace Metafy in May 2022. The gamerzclass.com domain no longer serves a live
  site and the company exposes no public API, developer portal, or documentation surface.
